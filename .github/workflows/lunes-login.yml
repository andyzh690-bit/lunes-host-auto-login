name: Lunes Host Auto Login

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
      timezone: 'Asia/Shanghai'

concurrency:
  group: lunes-host-auto-login
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_ID: ${{ secrets.SERVER_ID }}
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TURNSTILE_FAST_TIMEOUT_SECONDS: '5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Setup proxy
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.PROXY_URL }}
        run: bash scripts/setup_proxy.sh

      - name: Run login automation
        id: login
        run: |
          mkdir -p artifacts/screenshots
          START_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "start_time=$START_TIME" >> "$GITHUB_OUTPUT"
          set +e
          python scripts/login.py
          LOGIN_EXIT=$?
          set -e
          END_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "end_time=$END_TIME" >> "$GITHUB_OUTPUT"
          exit "$LOGIN_EXIT"

      - name: Read login result
        if: always()
        id: result
        run: |
          if [ -f artifacts/login-result.json ]; then
            echo "success=$(jq -r '.success' artifacts/login-result.json)" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r '.url' artifacts/login-result.json)" >> "$GITHUB_OUTPUT"
            echo "server_id=$(jq -r '.server_id' artifacts/login-result.json)" >> "$GITHUB_OUTPUT"
            echo "error=$(jq -r '.error // empty' artifacts/login-result.json)" >> "$GITHUB_OUTPUT"
            echo "turnstile_mode=$(jq -r '.turnstile_mode // empty' artifacts/login-result.json)" >> "$GITHUB_OUTPUT"
            echo "turnstile_seconds=$(jq -r '.turnstile_seconds // empty' artifacts/login-result.json)" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "error=result_missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram notification
        if: ${{ always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Lunes 自动登录
            状态: ${{ steps.result.outputs.success == 'true' && '成功' || '失败' }}
            服务器: ${{ steps.result.outputs.server_id }}
            CF 模式: ${{ steps.result.outputs.turnstile_mode }}
            CF 耗时: ${{ steps.result.outputs.turnstile_seconds }} 秒
            开始: ${{ steps.login.outputs.start_time }}
            结束: ${{ steps.login.outputs.end_time }}
            地址: ${{ steps.result.outputs.url }}
            原因: ${{ steps.result.outputs.error }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lunes-login-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
